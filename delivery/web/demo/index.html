<title>في السكة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&display=swap">
<style>
/* نظام التصميم نفسه بتاع التطبيق — delivery/web/src/app/globals.css */
:root {
  --brand-700:#00815A; --brand-600:#00A86B; --brand-500:#0FBF7F; --brand-400:#2BD99A;
  --brand-tint:#E6F9F0;
  --ink-900:#0B1220; --ink-700:#1C2736; --ink-600:#36425A; --ink-500:#5A6880;
  --ink-400:#8A96AD; --ink-300:#B9C2D2;
  --canvas:#F2F6F9; --surface:#FFFFFF; --line:#E6ECF2;
  --amber:#FFB020; --amber-tint:#FFF6E3; --sky:#2E7DF6; --sky-tint:#E8F1FE;
  --rose:#F0374B; --rose-tint:#FEECEE;
  --hero:linear-gradient(135deg,#00815A 0%,#00A86B 45%,#2BD99A 100%);
  --r-md:16px; --r-lg:22px; --r-full:999px;
  --sh-card:0 1px 2px rgba(11,18,32,.04), 0 8px 24px -12px rgba(11,18,32,.16);
  --sh-lift:0 2px 6px rgba(11,18,32,.06), 0 18px 40px -16px rgba(11,18,32,.28);
  --sh-brand:0 8px 22px -8px rgba(0,168,107,.55);
  --pad:16px; --tap:52px; --wrap:560px; --nav-h:66px;
  --ease:cubic-bezier(.22,.9,.3,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --ink-900:#F2F6FA; --ink-700:#DDE5EE; --ink-600:#B4C0D0; --ink-500:#8E9BAE;
  --ink-400:#6D7A8C; --ink-300:#4A5566;
  --canvas:#070B12; --surface:#111826; --line:#202B3D;
  --brand-tint:#06281D; --amber-tint:#2A2008; --sky-tint:#0B1D36; --rose-tint:#2A0F14;
  --sh-card:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
  --sh-lift:0 2px 8px rgba(0,0,0,.55), 0 20px 44px -18px rgba(0,0,0,.9);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink-900:#F2F6FA; --ink-700:#DDE5EE; --ink-600:#B4C0D0; --ink-500:#8E9BAE;
  --ink-400:#6D7A8C; --ink-300:#4A5566;
  --canvas:#070B12; --surface:#111826; --line:#202B3D;
  --brand-tint:#06281D; --amber-tint:#2A2008; --sky-tint:#0B1D36; --rose-tint:#2A0F14;
  --sh-card:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
  --sh-lift:0 2px 8px rgba(0,0,0,.55), 0 20px 44px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--canvas); color:var(--ink-900);
  font-family:'Alexandria','Segoe UI',Tahoma,system-ui,sans-serif;
  font-size:16px; line-height:1.55; direction:rtl; text-align:right;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav-h) + 22px);
}
a{color:inherit;text-decoration:none} button{font:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.rise{animation:rise .38s var(--ease) both}
.pop{animation:pop .28s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* بانر التجربة */
.demobar{
  background:var(--ink-900); color:var(--canvas);
  padding:9px var(--pad); font-size:12.5px; font-weight:700;
  display:flex; gap:7px; align-items:center; justify-content:center; text-align:center;
}
.demobar span{opacity:.75;font-weight:400}

.hero{background:var(--hero);color:#fff;padding:16px var(--pad) 54px;
  border-end-start-radius:26px;border-end-end-radius:26px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset-block-start:-70px;inset-inline-start:-50px;
  width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
.hero-logo{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.zonepick{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.26);border-radius:var(--r-full);padding:8px 14px;
  color:#fff;font-size:14px;font-weight:600;min-height:40px}
.hero h1{margin:16px 0 5px;font-size:clamp(21px,5.9vw,26px);font-weight:800;letter-spacing:-.02em;line-height:1.45;text-wrap:balance}
.hero p{margin:0;font-size:15px;opacity:.88}

.searchwrap{margin:-30px var(--pad) 0;position:relative;z-index:3}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-md);
  box-shadow:var(--sh-lift);padding:0 16px;min-height:56px}
.search input{flex:1;border:0;background:none;color:var(--ink-900);font:inherit;font-size:16px;min-width:0;padding:16px 0}
.search input::placeholder{color:var(--ink-400)}
.search input:focus{outline:none}
.search svg{color:var(--ink-400);flex:0 0 auto}

.sec{padding:20px var(--pad) 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}
.sec-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.sec-head .side{font-size:14px;color:var(--ink-500);font-weight:600;font-variant-numeric:tabular-nums}

.services{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px var(--pad) 2px;
  margin:0 calc(var(--pad)*-1);scroll-padding-inline:var(--pad)}
.services::-webkit-scrollbar{display:none}
.services::after{content:'';flex:0 0 8px}
.svc{flex:0 0 auto;width:74px;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 4px;border-radius:var(--r-md);background:var(--surface);border:2px solid transparent;
  box-shadow:var(--sh-card);transition:transform .18s var(--ease),border-color .18s var(--ease);cursor:pointer}
.svc:active{transform:scale(.95)}
.svc[aria-pressed="true"]{border-color:var(--brand-600)}
.svc .bubble{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.svc span{font-size:12.5px;font-weight:700;color:var(--ink-700);text-align:center;line-height:1.25}
.svc[aria-pressed="true"] span{color:var(--brand-700)}
.b-all{background:linear-gradient(140deg,#36425A,#0B1220)}
.b-delivery{background:linear-gradient(140deg,#00C07E,#00815A)}
.b-tuktuk{background:linear-gradient(140deg,#FFC24D,#F08C00)}
.b-goods{background:linear-gradient(140deg,#5B9BFF,#2452D6)}
.b-bicycle{background:linear-gradient(140deg,#4FD1D9,#12879B)}
.b-mahalla{background:linear-gradient(140deg,#B07CFF,#6D2FD4)}
.b-restaurant{background:linear-gradient(140deg,#FF8A5B,#E0452B)}
.b-supermarket{background:linear-gradient(140deg,#5B9BFF,#2452D6)}
.b-grocery{background:linear-gradient(140deg,#00C07E,#00815A)}
.b-herbalist{background:linear-gradient(140deg,#8FD14F,#46811F)}
.b-bakery{background:linear-gradient(140deg,#FFC24D,#D98A00)}
.b-butcher{background:linear-gradient(140deg,#FF7A8A,#C42A48)}
.b-produce{background:linear-gradient(140deg,#7ED957,#2E9E3E)}
.b-pharmacy{background:linear-gradient(140deg,#4FD1D9,#0E7C8C)}
.b-stationery{background:linear-gradient(140deg,#B07CFF,#6D2FD4)}

.zones{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.zones::-webkit-scrollbar{display:none}
.zones::after{content:'';flex:0 0 8px}
.zchip{flex:0 0 auto;min-height:40px;display:inline-flex;align-items:center;padding:0 15px;
  border-radius:var(--r-full);background:var(--surface);border:1.5px solid var(--line);
  color:var(--ink-600);font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .16s var(--ease)}
.zchip:active{transform:scale(.95)}
.zchip[aria-pressed="true"]{background:var(--ink-900);border-color:var(--ink-900);color:var(--canvas)}

.cards{display:flex;flex-direction:column;gap:12px}
.row{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:15px;
  display:grid;grid-template-columns:auto 1fr;gap:13px;border:1.5px solid transparent}
.row.live{border-color:rgba(0,168,107,.3)}
.avatar{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;
  font-weight:800;font-size:20px;color:#fff;position:relative;flex:0 0 auto}
.avatar .vbadge{position:absolute;inset-block-end:-4px;inset-inline-end:-4px;width:22px;height:22px;
  border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;border:2.5px solid var(--surface)}
.row .head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row h3{margin:0;font-size:17.5px;font-weight:800;letter-spacing:-.01em}
.rate{display:inline-flex;align-items:center;gap:3px;background:var(--amber-tint);color:#8A5B00;
  border-radius:var(--r-full);padding:2px 8px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rate{color:var(--amber)}}
:root[data-theme="dark"] .rate{color:var(--amber)}
.row .meta{margin:5px 0 0;color:var(--ink-500);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .subnote{margin:3px 0 0;color:var(--ink-400);font-size:13.5px;line-height:1.5}
.state{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-full);
  padding:5px 11px 5px 9px;font-size:13px;font-weight:800;margin-top:9px}
.state.on{background:var(--brand-tint);color:var(--brand-700)}
.state.off{background:var(--canvas);color:var(--ink-500)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .state.on{color:var(--brand-400)}}
:root[data-theme="dark"] .state.on{color:var(--brand-400)}
.state .since{font-weight:500;opacity:.8}
.beacon{position:relative;width:9px;height:9px;flex:0 0 auto}
.beacon i{position:absolute;inset:0;border-radius:50%;background:currentColor}
.state.on .beacon i:first-child{animation:ping 1.9s var(--ease) infinite}
.row .actions{display:flex;gap:9px;margin-top:13px}

.btn{min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 18px;border-radius:14px;border:0;background:var(--ink-900);color:var(--canvas);
  font-size:16px;font-weight:800;cursor:pointer;transition:transform .16s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.call{background:var(--brand-600);color:#fff;box-shadow:var(--sh-brand);white-space:nowrap}
.row .btn.call{flex:1 1 auto;min-width:0;padding:0 12px}
.btn.wa{background:#25D366;color:#fff;flex:0 0 auto;width:54px;padding:0}
.btn.ghost{background:var(--surface);color:var(--ink-900);border:1.5px solid var(--line)}
.btn.quiet{background:var(--canvas);color:var(--ink-600);font-size:14.5px;font-weight:700;
  min-height:44px;padding:0 14px;border-radius:12px}
.btn.wide{width:100%}

.empty{background:var(--surface);border-radius:var(--r-lg);padding:32px 22px;text-align:center;box-shadow:var(--sh-card)}
.empty .ill{width:68px;height:68px;border-radius:24px;margin:0 auto 16px;background:var(--brand-tint);
  color:var(--brand-600);display:grid;place-items:center}
.empty h3{margin:0 0 7px;font-size:18px;font-weight:800}
.empty p{margin:0 0 18px;color:var(--ink-500);font-size:15px}

.nav{position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--surface);
  border-block-start:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -6px 24px -14px rgba(11,18,32,.3)}
.nav ul{max-width:var(--wrap);margin:0 auto;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{width:100%;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--ink-400);font-size:11.5px;font-weight:700;
  background:none;border:0;cursor:pointer;transition:color .18s var(--ease)}
.nav button[aria-current="page"]{color:var(--brand-600)}
.nav .ic{transition:transform .2s var(--ease)}
.nav button[aria-current="page"] .ic{transform:translateY(-2px)}

.page{padding:20px var(--pad) 26px}
.page h1{font-size:24px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
.page h2{font-size:17px;font-weight:800;margin:26px 0 12px}
.page .lede{color:var(--ink-500);margin:0 0 18px;font-size:15px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:18px;margin-bottom:14px}

.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:700;font-size:14px;margin-bottom:7px;color:var(--ink-700)}
.field input,.field textarea,.field select{width:100%;min-height:var(--tap);padding:13px 15px;
  border:1.5px solid var(--line);border-radius:14px;background:var(--canvas);color:var(--ink-900);
  font:inherit;font-size:16px;transition:border-color .18s var(--ease)}
.field textarea{min-height:104px;resize:vertical;line-height:1.6}
.field :is(input,textarea,select):focus{border-color:var(--brand-600);outline:none}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:7px;min-height:44px;border:1.5px solid var(--line);
  border-radius:var(--r-full);padding:8px 14px;font-size:14.5px;font-weight:700;cursor:pointer;background:var(--surface)}
.checks input{width:18px;height:18px;accent-color:var(--brand-600)}

.note{display:flex;gap:11px;background:var(--sky-tint);color:var(--ink-700);border-radius:var(--r-md);
  padding:14px 15px;margin:0 0 16px;font-size:14.5px;line-height:1.6}
.note .ic{color:var(--sky);flex:0 0 auto;margin-top:2px}
.note.warn{background:var(--rose-tint)} .note.warn .ic{color:var(--rose)}
.note strong{font-weight:800}
.msg{display:flex;align-items:center;gap:9px;padding:13px 15px;border-radius:14px;margin-bottom:16px;
  font-weight:700;font-size:14.5px;background:var(--brand-tint);color:var(--brand-700)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg{color:var(--brand-400)}}
:root[data-theme="dark"] .msg{color:var(--brand-400)}

.rates{display:flex;flex-direction:column;gap:10px}
.rate-row{display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:var(--r-md);
  box-shadow:var(--sh-card);padding:13px 15px}
.rate-row .bubble{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.rate-row .t{flex:1;min-width:0}
.rate-row .t b{display:block;font-size:15.5px;font-weight:800}
.rate-row .t span{color:var(--ink-500);font-size:13px}
.rate-row .v{text-align:center;flex:0 0 auto}
.rate-row .v em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--ink-400)}
.rate-row .v b{font-size:21px;font-weight:800;color:var(--brand-700);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rate-row .v b{color:var(--brand-400)}}
:root[data-theme="dark"] .rate-row .v b{color:var(--brand-400)}

.price{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.price:last-child{border-bottom:0}
.price .bubble{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.price .t{flex:1;min-width:0}
.price .t b{display:block;font-size:15.5px;font-weight:800}
.price .t span{color:var(--ink-500);font-size:13.5px}
.price .v{font-weight:800;font-size:16px;white-space:nowrap;color:var(--brand-700);font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .price .v{color:var(--brand-400)}}
:root[data-theme="dark"] .price .v{color:var(--brand-400)}

.req{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:16px;margin-bottom:12px}
.req p{margin:0 0 11px;font-size:15.5px;line-height:1.6}
.req .when{display:flex;align-items:center;gap:7px;color:var(--ink-400);font-size:13px;font-weight:600;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:var(--r-full);background:var(--sky-tint);color:var(--sky)}

.toggle{width:100%;min-height:150px;border:0;border-radius:24px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:25px;font-weight:800;
  color:#fff;position:relative;overflow:hidden;
  transition:transform .2s var(--ease),box-shadow .3s var(--ease),background .3s var(--ease)}
.toggle.on{background:var(--hero);box-shadow:0 16px 40px -14px rgba(0,168,107,.75)}
.toggle.off{background:linear-gradient(140deg,#5A6880,#36425A);box-shadow:var(--sh-card)}
.toggle:active{transform:scale(.97)}
.toggle small{font-size:14px;font-weight:600;opacity:.92}
.toggle .ring{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.toggle.on .ring{animation:ping 2.6s var(--ease) infinite}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(11,18,32,.5);animation:fadeIn .22s var(--ease) both;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:var(--wrap);background:var(--surface);
  border-start-start-radius:26px;border-start-end-radius:26px;
  padding:10px var(--pad) calc(22px + env(safe-area-inset-bottom,0px));
  animation:sheetUp .3s var(--ease) both;max-height:86vh;overflow-y:auto}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.step{display:flex;gap:12px;margin-bottom:16px}
.step .n{width:28px;height:28px;border-radius:50%;flex:0 0 auto;background:var(--brand-600);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:800}
.step .c{flex:1;min-width:0}
.step .c b{display:block;font-size:15.5px;font-weight:800;margin-bottom:3px}
.step .c p{margin:0 0 10px;color:var(--ink-500);font-size:14px;line-height:1.55}
.mini{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mini:last-child{border-bottom:0}
.mini .t{flex:1;min-width:0}
.mini .t b{display:block;font-size:15px;font-weight:800}
.mini .t span{color:var(--ink-500);font-size:12.5px}

/* الرقم كنص يتنسخ — روابط tel: مش مضمونة جوه صفحة زي دي */
.telbox{display:flex;align-items:center;gap:10px;background:var(--canvas);border:1.5px solid var(--line);
  border-radius:14px;padding:11px 14px;margin-top:10px}
.telbox .num{flex:1;font-weight:800;font-size:17px;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;direction:ltr;text-align:left;user-select:all}
.telbox button{background:var(--brand-600);color:#fff;border:0;border-radius:11px;padding:9px 14px;
  font-size:14px;font-weight:800;cursor:pointer;min-height:42px;white-space:nowrap}

.foot{padding:22px var(--pad) 8px;color:var(--ink-400);font-size:13px;line-height:1.7}
.foot p{margin:0 0 9px}
.foot strong{color:var(--ink-600)}
</style>

<div class="demobar">
  نسخة تجريبية <span>· الأسماء والأرقام دي مش حقيقية</span>
</div>

<div id="app"></div>

<nav class="nav" aria-label="التنقل">
  <ul>
    <li><button data-tab="home" aria-current="page">
      <svg class="ic" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.3"/></svg>

          <span class="bubble b-${k === 'mahalla_run' ? 'mahalla' : k}">${I(k,22)}</span>
          <span>${SERVICE[k]}</span></button>`).join('')}
      </div></section>

    <section class="sec"><div class="zones">
      <button class="zchip" data-zone="" aria-pressed="${st.zone === null}">كل القرى</button>
      ${ZONES.map((z) => `<button class="zchip" data-zone="${esc(z)}" aria-pressed="${st.zone === z}">${esc(z)}</button>`).join('')}
    </div></section>

    <section class="sec">
      <div class="sec-head"><h2>${live.length ? `متاحين دلوقتي ${where}` : `مفيش حد متاح ${where}`}</h2>
        ${live.length ? `<span class="side">${live.length}</span>` : ''}</div>
      ${live.length
        ? `<div class="cards">${live.map(card).join('')}</div>`
        : `<div class="empty pop"><div class="ill">${I('sleep',30)}</div>
            <h3>مفيش حد فاتح دلوقتي</h3>
            <p>جرّب قرية جنبك، أو اكتب طلبك واللي هيفتح هيشوفه.</p>
            <button class="btn call wide" data-go="requests">اكتب طلبك</button></div>`}
      ${off.length ? `<div class="sec-head" style="margin:22px 0 11px"><h2>مش متاحين دلوقتي</h2>
        <span class="side">${off.length}</span></div>
        <div class="cards">${off.map(card).join('')}</div>` : ''}
    </section>

    <section class="sec">
      <div class="sec-head"><h2>جرّب كأنك سائق</h2></div>
      <div class="card">
        <p class="lede">في التطبيق الحقيقي كل سائق بياخد لينك سري، يفتحه ويضغط زرار واحد.
          دوس هنا وشوف «${esc(DRIVERS[0].name)}» بيتحرك في القايمة فوق.</p>
        <button class="toggle ${liveOf(DRIVERS[0]) ? 'on' : 'off'}" data-toggle="d1">
          ${liveOf(DRIVERS[0]) ? '<span class="ring"></span>' : ''}
          ${liveOf(DRIVERS[0]) ? 'أنا متاح' : 'مش متاح'}
          <small>${liveOf(DRIVERS[0]) ? 'اضغط لما تخلص' : 'اضغط لما تبقى فاضي'}</small>
        </button>
        <p class="lede" style="margin:14px 0 0;text-align:center">
          بيتقفل لوحده بعد ٤ ساعات لو نسيت — عشان القايمة تفضل صادقة.</p>
      </div>
    </section>
    ${foot()}
  </main>`;
}

/* ---------- شاشة المحلات ---------- */
function viewPlaces() {
  const list = PLACES.filter((p) =>
    (st.cat === null || p.cat === st.cat) &&
    (st.pzone === null || p.zone === st.pzone) &&
    (st.pterm === '' || p.name.includes(st.pterm) || (p.addr || '').includes(st.pterm)));
  const cats = [...new Set(PLACES.map((p) => p.cat))];

  return `
  <header class="hero">
    <div class="hero-top">
      <div class="hero-brand"><span class="hero-logo">${I('grocery',20)}</span> المحلات والمطاعم</div>
      <span class="zonepick">${I('pin',15)} القيصرية</span>
    </div>
    <h1>اطلب من أي محل في البلد</h1>
    <p>كلّم المحل واطلب، وبعدين كلّم سائق يستلم منهم.</p>
  </header>
  <main class="wrap">
    <div class="searchwrap"><div class="search">${I('search',21)}
      <input id="q-places" type="search" value="${esc(st.pterm)}" placeholder="دوّر على محل أو مطعم" aria-label="بحث"></div></div>

    <section class="sec"><div class="sec-head"><h2>التصنيفات</h2></div>
      <div class="services">
        <button class="svc" data-cat="" aria-pressed="${st.cat === null}">
          <span class="bubble b-all">${I('all',22)}</span><span>الكل</span></button>
        ${cats.map((c) => `<button class="svc" data-cat="${c}" aria-pressed="${st.cat === c}">
          <span class="bubble b-${c}">${I(c,22)}</span><span>${CAT[c]}</span></button>`).join('')}
      </div></section>

    <section class="sec"><div class="zones">
      <button class="zchip" data-pzone="" aria-pressed="${st.pzone === null}">كل القرى</button>
      ${ZONES.map((z) => `<button class="zchip" data-pzone="${esc(z)}" aria-pressed="${st.pzone === z}">${esc(z)}</button>`).join('')}
    </div></section>

    <section class="sec">
      <div class="sec-head"><h2>${st.cat ? CAT[st.cat] : 'كل المحلات'}</h2>
        ${list.length ? `<span class="side">${list.length}</span>` : ''}</div>
      ${list.length ? `<div class="cards">${list.map((p, i) => `
        <article class="row rise" style="animation-delay:${Math.min(i,8)*50}ms">
          <span class="avatar b-${p.cat}">${I(p.cat,24)}</span>
          <div>
            <div class="head"><h3>${esc(p.name)}</h3>
              ${p.rate ? `<span class="rate">${I('star',13)} ${p.rate}</span>` : ''}</div>
            <p class="meta">${CAT[p.cat]} ${I('pin',13)} ${esc(p.zone)}</p>
            ${p.addr ? `<p class="subnote">${esc(p.addr)}</p>` : ''}
            ${p.hrs ? `<p class="subnote">${I('clock',13)} ${esc(p.hrs)}</p>` : ''}
            ${p.note ? `<p class="subnote">${esc(p.note)}</p>` : ''}
            <div class="actions">
              <button class="btn call" data-sheet="place:${p.id}">اطلب من هنا</button>
              ${p.wa ? `<a class="btn wa" href="${waLink(p.phone,'السلام عليكم، عايز أطلب من ' + p.name)}"
                target="_blank" rel="noreferrer" aria-label="واتساب ${esc(p.name)}">${I('wa',22)}</a>` : ''}
            </div>
          </div>
        </article>`).join('')}</div>`
        : `<div class="empty pop"><h3>مفيش نتايج</h3><p>مفيش محل مطابق للاختيار ده.</p>
            <button class="btn ghost wide" data-clear="places">شيل الفلاتر</button></div>`}
    </section>
    ${foot()}
  </main>`;
}

/* ---------- شاشة الطلبات ---------- */
function viewRequests() {
  const all = [...st.reqs, ...SEED_REQS];
  return `
  <header class="hero">
    <div class="hero-top"><div class="hero-brand">
      <span class="hero-logo">${I('clock',20)}</span> لوحة الطلبات</div></div>
    <h1>مش لاقي حد متاح؟</h1>
    <p>اكتب اللي محتاجه، واللي هيفتح هيشوفه ويكلمك.</p>
  </header>
  <main class="wrap page" style="padding-top:22px">
    <div class="card">
      ${st.toast ? `<p class="msg">${I('check',16)} ${esc(st.toast)}</p>` : ''}
      <label class="field" for="rq-body"><span>محتاج إيه؟</span>
        <textarea id="rq-body" maxlength="500" placeholder="مثال: محتاج حد يجيبلي دوا من صيدلية في المحلة النهاردة بالليل"></textarea></label>
      <label class="field" for="rq-phone"><span>رقم موبايلك</span>
        <input id="rq-phone" type="tel" inputmode="tel" placeholder="01xxxxxxxxx"></label>
      <div class="checks" style="margin-bottom:10px">
        <label><input type="checkbox" id="rq-hide" checked> اخفي رقمي</label>
      </div>
      <p class="lede" id="rq-hint" style="font-size:13.5px">رقمك هيظهر ناقص كده 0101••••78، والسواقين هيكلموك من جوه التطبيق.</p>
      <button class="btn call wide" id="rq-send">انشر الطلب</button>
    </div>

    <h2>الطلبات المفتوحة</h2>
    ${all.length ? all.map((r) => {
      const mask = r.phone.slice(0,4) + '••••' + r.phone.slice(-2);
      return `<div class="req rise">
        <p>${esc(r.body)}</p>
        <div class="when">
          ${r.zone ? `${I('pin',13)} ${esc(r.zone)}` : ''}
          ${r.kind ? `<span class="pill">${SERVICE[r.kind]}</span>` : ''}
          ${I('clock',13)} ${since(r.ago ?? Math.floor((Date.now() - r.at) / MIN))}
          ${r.hide ? `<span class="pill">${I('shield',12)} الرقم مخفي</span>` : ''}
        </div>
        ${r.hide
          ? `<p class="lede" style="margin:10px 0 0;font-size:14px">${esc(mask)} — صاحب الطلب مخفي رقمه.
              السواقين بيكلموه من جوه التطبيق.</p>`
          : telBox(r.phone)}
      </div>`;
    }).join('') : '<p class="lede">مفيش طلبات دلوقتي. أول واحد يكتب.</p>'}

    <div class="note" style="margin-top:18px">${I('info',19)}
      <span>الطلب بيختفي لوحده بعد <strong>٦ ساعات</strong>. متكتبش بيانات أكتر من اللازم — الصفحة دي مفتوحة لأي حد.</span></div>
    ${foot()}
  </main>`;
}

/* ---------- شاشة الأسعار ---------- */
function viewPrices() {
  return `
  <header class="hero">
    <div class="hero-top"><div class="hero-brand">
      <span class="hero-logo">${I('logo',20)}</span> الأسعار</div></div>
    <h1>اعرف السعر العادل قبل ما تتفق</h1>
    <p>دي متوسط اللي بيتدفع في البلد.</p>
  </header>
  <main class="wrap page" style="padding-top:22px">
    <div class="note warn">${I('alert',19)}
      <span><strong>دي مش تسعيرة ملزمة.</strong> إحنا مش بنحدد أسعار ومش بناخد عمولة.
        الاتفاق النهائي بينك وبين السائق.</span></div>

    <h2 style="margin-top:0">يبدأ من</h2>
    <div class="rates">${RATES.map((r) => `
      <div class="rate-row">
        <span class="bubble b-${r.k === 'mahalla_run' ? 'mahalla' : r.k}">${I(r.k,22)}</span>
        <span class="t"><b>${SERVICE[r.k]}</b><span>${esc(r.note)}</span></span>
        <span class="v"><em>من</em><b>${r.from} ج</b></span>
      </div>`).join('')}</div>

    <div class="note" style="margin-top:16px">${I('info',19)}
      <span>العجلة رخيصة عن قصد. الطلب القريب جوه البلد مش محتاج موتوسيكل، وده بيخلي
        أي حد عنده عجلة يقدر يشتغل ويكسب.</span></div>

    <h2>الأسعار حسب المشوار</h2>
    <div class="card">${PRICES.map((p) => `
      <div class="price">
        <span class="bubble b-${p.k === 'mahalla_run' ? 'mahalla' : p.k}">${I(p.k,20)}</span>
        <span class="t"><b>${esc(p.t)}</b><span>${esc(p.s)}</span></span>
        <span class="v">${p.lo}–${p.hi} ج</span>
      </div>`).join('')}</div>

    <h2>لو محتاج حاجة من المحلة</h2>
    <div class="card"><p class="lede" style="margin:0">
      مشوار المحلة ذهاب وعودة تكلفته الحقيقية على السائق ٣٥–٤٥ جنيه بنزين وصيانة، قبل ما ياخد مليم.
      لو تلات ناس محتاجين حاجة من المحلة في نفس اليوم، مشوار واحد يخدمكم كلكم: كل واحد يدفع أقل
      والسائق ياخد أكتر.</p></div>
    ${foot()}
  </main>`;
}

const foot = () => `<footer class="foot">
  <p><strong>في السكة</strong> خدمة مجتمعية مجانية بتعرض بيانات سواقين ومحلات في المنطقة عشان تسهّل
    التواصل. إحنا مش طرف في أي اتفاق، ومش بناخد عمولة، ومش بنحدد أسعار ملزمة.</p>
  <p><strong>دي نسخة تجريبية.</strong> الأسماء والأرقام والتقييمات كلها بيانات وهمية للتجربة بس.</p>
</footer>`;

/* ---------- الورقة السفلية ---------- */
function sheetHTML() {
  if (!st.sheet) return '';
  const [type, id] = st.sheet.split(':');
  if (type === 'driver') {
    const d = DRIVERS.find((x) => x.id === id);
    if (!d) return '';
    return `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true">
      <div class="grab"></div>
      <h2 style="margin:0 0 3px;font-size:19px;font-weight:800">${esc(d.name)}</h2>
      <p style="margin:0 0 6px;color:var(--ink-500);font-size:14px">
        ${d.svc.map((s) => SERVICE[s]).join('، ')} · ${esc(d.zone)}</p>
      ${telBox(d.phone)}
      <p class="lede" style="margin:12px 0 14px;font-size:13.5px">
        في التطبيق الحقيقي الزرار ده بيفتح الاتصال على طول.</p>
      ${d.wa ? `<a class="btn wa wide" style="width:100%;margin-bottom:10px"
        href="${waLink(d.phone,'السلام عليكم، لقيت رقمك في «في السكة»')}" target="_blank" rel="noreferrer">
        ${I('wa',20)} افتح واتساب</a>` : ''}
      <button class="btn quiet wide" data-close>إغلاق</button></div></div>`;
  }
  const p = PLACES.find((x) => x.id === id);
  if (!p) return '';
  const near = DRIVERS.filter(liveOf).slice(0, 3);
  const msg = `السلام عليكم، ممكن تستلملي طلب من ${p.name}${p.addr ? ` (${p.addr})` : ''} في ${p.zone}؟`;
  return `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h2 style="margin:0 0 3px;font-size:19px;font-weight:800">${esc(p.name)}</h2>
    <p style="margin:0 0 20px;color:var(--ink-500);font-size:14px">${CAT[p.cat]} · ${esc(p.zone)}</p>

    <div class="step"><span class="n">1</span><div class="c">
      <b>كلّم المحل واطلب</b>
      <p>قوله على طلبك، واسأله هيبقى جاهز إمتى وبكام.</p>
      ${telBox(p.phone)}
      ${p.wa ? `<a class="btn wa wide" style="width:100%;margin-top:10px"
        href="${waLink(p.phone,'السلام عليكم، عايز أطلب من ' + p.name)}" target="_blank" rel="noreferrer">
        ${I('wa',20)} افتح واتساب</a>` : ''}
    </div></div>

    <div class="step"><span class="n">2</span><div class="c">
      <b>كلّم سائق يستلم منهم</b>
      ${near.length === 0
        ? '<p>مفيش سائق متاح دلوقتي. اكتب طلبك في لوحة الطلبات.</p>'
        : `<p>الرسالة هتتكتب لوحدها — بس ابعتها.</p>
           ${near.map((d) => `<div class="mini">${I(d.svc[0],18)}
             <span class="t"><b>${esc(d.name)}</b><span>${esc(d.veh)}</span></span>
             ${d.wa ? `<a class="btn wa" style="width:46px;min-height:44px"
               href="${waLink(d.phone, msg)}" target="_blank" rel="noreferrer"
               aria-label="واتساب ${esc(d.name)}">${I('wa',19)}</a>`
             : `<button class="btn quiet" data-copy="${esc(d.phone)}">انسخ رقمه</button>`}
             </div>`).join('')}`}
    </div></div>

    <button class="btn quiet wide" data-close>إغلاق</button></div></div>`;
}

/* ---------- الرسم ---------- */
const app = document.getElementById('app');
function render(keepFocus) {
  const views = { home: viewHome, places: viewPlaces, requests: viewRequests, prices: viewPrices };
  app.innerHTML = views[st.tab]() + sheetHTML();
  document.querySelectorAll('.nav button').forEach((b) => {
    if (b.dataset.tab === st.tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  if (keepFocus) {
    const el = document.getElementById(keepFocus);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

/* ---------- التفاعل ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-kind],[data-zone],[data-cat],[data-pzone],[data-toggle],[data-sheet],[data-close],[data-copy],[data-go],[data-clear]');
  if (!t) return;

  if (t.dataset.copy !== undefined) {
    const num = t.dataset.copy;
    const done = () => { t.textContent = 'اتنسخ ✓'; setTimeout(() => { t.textContent = t.dataset.label || 'انسخ الرقم'; }, 1600); };
    t.dataset.label = t.dataset.label || t.textContent;
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(num).then(done).catch(() => selectNum(t));
    else selectNum(t);
    return;
  }
  if (t.dataset.tab) { st.tab = t.dataset.tab; st.sheet = null; st.toast = null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.go) { st.tab = t.dataset.go; render(); window.scrollTo(0,0); return; }
  if (t.dataset.kind !== undefined) { st.kind = t.dataset.kind || null; render(); return; }
  if (t.dataset.zone !== undefined) { st.zone = t.dataset.zone || null; render(); return; }
  if (t.dataset.cat !== undefined) { st.cat = t.dataset.cat || null; render(); return; }
  if (t.dataset.pzone !== undefined) { st.pzone = t.dataset.pzone || null; render(); return; }
  if (t.dataset.clear) { st.cat = null; st.pzone = null; st.pterm = ''; render(); return; }
  if (t.dataset.toggle) {
    const d = DRIVERS.find((x) => x.id === t.dataset.toggle);
    st.off[d.id] = { on: !liveOf(d), at: Date.now() };
    save(); render(); return;
  }
  if (t.dataset.sheet) { st.sheet = t.dataset.sheet; render(); return; }
  if (t.dataset.close !== undefined) { st.sheet = null; render(); return; }
});

function selectNum(btn) {
  const num = btn.closest('.telbox')?.querySelector('.num') || btn.parentElement?.querySelector('.num');
  if (!num) return;
  const r = document.createRange(); r.selectNodeContents(num);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  btn.textContent = 'محدد — انسخه';
}

document.addEventListener('input', (e) => {
  if (e.target.id === 'q-home') { st.term = e.target.value; render('q-home'); }
  if (e.target.id === 'q-places') { st.pterm = e.target.value; render('q-places'); }
  if (e.target.id === 'rq-hide') {
    const h = document.getElementById('rq-hint');
    if (h) h.textContent = e.target.checked
      ? 'رقمك هيظهر ناقص كده 0101••••78، والسواقين هيكلموك من جوه التطبيق.'
      : 'رقمك هيظهر كامل لأي حد يفتح الصفحة، وأي سائق يقدر يتصل بيك على طول.';
  }
});

document.addEventListener('click', (e) => {
  if (e.target.id !== 'rq-send') return;
  const body = document.getElementById('rq-body').value.trim();
  const phone = document.getElementById('rq-phone').value.replace(/\s/g, '');
  const hide = document.getElementById('rq-hide').checked;
  const hint = document.getElementById('rq-hint');
  if (body.length < 5) { hint.textContent = 'اكتب طلبك بتفصيل شوية (٥ حروف على الأقل).'; hint.style.color = 'var(--rose)'; return; }
  if (!/^0\d{9,10}$/.test(phone)) { hint.textContent = 'اكتب رقم موبايل صح، يبدأ بصفر.'; hint.style.color = 'var(--rose)'; return; }
  st.reqs.unshift({ id: 'u' + Date.now(), body, phone, hide, zone: null, kind: null, at: Date.now() });
  st.toast = 'طلبك اتنشر. السواقين هيشوفوه دلوقتي.';
  save(); render(); window.scrollTo(0, 0);
});

render();
})();
</script>
