<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>في السكة</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center; text-align: center;
    padding: 24px; gap: 18px;
    font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
    background: #F2F6F9; color: #0B1220;
  }
  @media (prefers-color-scheme: dark) { body { background: #070B12; color: #F2F6FA; } }
  .logo {
    width: 76px; height: 76px; border-radius: 24px;
    background: linear-gradient(135deg,#00815A,#00A86B 45%,#2BD99A);
    display: grid; place-items: center; margin: 0 auto;
  }
  h1 { font-size: 21px; margin: 0; font-weight: 800; }
  p { margin: 0; color: #5A6880; font-size: 15px; line-height: 1.6; max-width: 30ch; }
  button {
    font: inherit; font-weight: 700; font-size: 16px;
    background: #00A86B; color: #fff; border: 0;
    border-radius: 14px; padding: 15px 28px; cursor: pointer;
  }
</style>
</head>
<body>
  <div>
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
        <rect x="3" y="4" width="4" height="16" rx="2"/>
        <rect x="10" y="4" width="11" height="3.6" rx="1.8" opacity=".95"/>
        <rect x="10" y="10.2" width="8" height="3.6" rx="1.8" opacity=".7"/>
        <rect x="10" y="16.4" width="5" height="3.6" rx="1.8" opacity=".45"/>
      </svg>
    </div>
  </div>
  <h1>مفيش نت</h1>
  <p>التطبيق محتاج إنترنت عشان يجيب مين متاح دلوقتي. اتأكد من الشبكة وجرّب تاني.</p>
  <button onclick="location.reload()">جرّب تاني</button>
</body>
</html>
